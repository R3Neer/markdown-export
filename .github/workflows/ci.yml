name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test,build]"
      - run: pytest
      - run: python -m build
      - run: python -m compileall -q src tests

  obsidian:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:versions
      - run: npm run check
      - run: npm run pack:release

  installed-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv smoke
      - run: smoke/bin/python -m pip install dist/*.whl
      - run: smoke/bin/markdown-export --version
      - run: smoke/bin/markdown-export --help
      - run: npm ci
      - run: npm run check
      - run: git diff --check
      - run: test -z "$(git status --porcelain --untracked-files=no)"

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install -e ".[test,build]"
      - run: pytest
      - run: python -m build --outdir release/python
      - run: npm ci
      - run: npm run check:versions
      - run: npm run check
      - run: npm run pack:release
      - name: Verify tag version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Package Obsidian adapter
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          cd release/obsidian
          zip "../r3-markdown-export-${version}-obsidian.zip" main.js manifest.json styles.css
      - name: Write checksums
        run: cd release && sha256sum python/* obsidian/* r3-markdown-export-0.1.0-obsidian.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/python/*
          release/obsidian/main.js
          release/obsidian/manifest.json
          release/obsidian/styles.css
          release/r3-markdown-export-*-obsidian.zip
          release/SHA256SUMS.txt
          --generate-notes

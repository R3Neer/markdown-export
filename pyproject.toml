[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "r3-markdown-export"
version = "0.1.1"
description = "Create portable Markdown exports from Obsidian vaults and document trees"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "R3Neer" }]
dependencies = [
  "r3-cli @ https://github.com/R3Neer/R3CLI/archive/v0.4.0.zip",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["build>=1.2,<2"]

[project.scripts]
markdown-export = "markdown_export.cli:main"

[project.urls]
Repository = "https://github.com/R3Neer/markdown-export"
Issues = "https://github.com/R3Neer/markdown-export/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_export"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider", "--basetemp=.pytest-tmp"]
